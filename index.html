<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memento Mori & Journal</title>
    
    <meta name="theme-color" content="#f6efe8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Memento">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        /* 🎨 ui - Variables globales */
        :root {
            --bg-color: #f6efe8; 
            --text-color: #1a2f33; 
            --text-light: #6b777a;
            --border-color: #a4b0b3; 
            --accent-color: #8b5a2b;
            --font-main: 'Georgia', serif;
            --font-sans: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-main); margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }

        .container { max-width: 800px; width: 100%; padding: 2rem; box-sizing: border-box; }

        nav {
            width: 100%; display: flex; justify-content: center; gap: 2rem;
            padding: 1.5rem 0; border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem; font-family: var(--font-sans);
            text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem;
        }
        .nav-item { cursor: pointer; color: var(--text-light); text-decoration: none; padding-bottom: 0.5rem; border-bottom: 2px solid transparent; transition: all 0.3s ease; }
        .nav-item:hover, .nav-item.active { color: var(--text-color); border-bottom-color: var(--text-color); font-weight: bold; }

        h1 { font-weight: normal; font-size: 2.5rem; text-align: center; margin-top: 0; margin-bottom: 2rem; }

        .setup-form {
            display: flex; flex-direction: column; gap: 1rem; max-width: 600px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.3); padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .setup-form label { font-style: italic; font-size: 1rem; margin-top: 0.5rem;}
        .setup-form input { font-family: var(--font-sans); padding: 0.8rem; border: 1px solid var(--border-color); background: transparent; border-radius: 4px; font-size: 1rem; outline: none; }
        .github-section { border-top: 1px dashed var(--border-color); padding-top: 1.5rem; margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem;}

        .question-card { background: #fdfbf7; padding: 2.5rem; border-radius: 4px; max-width: 600px; margin: 0 auto 2rem auto; box-shadow: 0 4px 20px rgba(44, 40, 37, 0.05); border: 1px solid var(--border-color); }
        .current-date { font-family: var(--font-sans); color: var(--text-light); font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1rem; display: block; }
        .question-text { font-size: 1.8rem; line-height: 1.4; margin: 0 0 2rem 0; font-style: italic; }
        
        textarea { width: 100%; min-height: 120px; background: transparent; border: none; border-bottom: 2px dashed var(--border-color); font-family: var(--font-main); font-size: 1.2rem; color: var(--text-color); resize: none; outline: none; line-height: 1.6; padding: 0.5rem 0; overflow: hidden; transition: border-color 0.3s ease; }
        textarea:focus { border-bottom-color: var(--accent-color); }

        .btn-primary { font-family: var(--font-main); background-color: var(--text-color); color: var(--bg-color); border: none; padding: 1rem 2rem; font-size: 1.1rem; cursor: pointer; border-radius: 4px; margin-top: 1.5rem; transition: background 0.3s ease; display: block; width: 100%; }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; }
        
        .btn-secondary { background: transparent; border: 1px solid var(--text-color); color: var(--text-color); padding: 0.8rem 1.5rem; border-radius: 4px; cursor: pointer; font-family: var(--font-main); font-size: 1rem; transition: all 0.2s; width: 100%; margin-top: 0.5rem;}
        .btn-secondary:hover { background: var(--text-color); color: var(--bg-color); }

        .nav-days { display: flex; justify-content: space-between; margin: 0 auto 1rem auto; max-width: 600px; }
        .nav-btn { background: none; border: none; color: var(--text-light); font-size: 0.9rem; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
        .nav-btn:hover { color: var(--accent-color); }

        .history-container { max-width: 600px; margin: 0 auto 2rem auto; display: flex; flex-direction: column; gap: 1rem; }
        .history-card { background: rgba(255, 255, 255, 0.4); padding: 1.5rem; border-radius: 4px; border-left: 3px solid var(--border-color); }
        .history-year { font-family: var(--font-sans); color: var(--text-light); font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: bold; display: block; }
        .history-text { margin: 0; line-height: 1.5; font-size: 1.1rem; }

        .memento-header { text-align: center; margin-bottom: 2rem; }
        .memento-stats { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .memento-quote { font-style: italic; color: var(--text-light); font-size: 1.1rem; }
        .memento-actions { display: flex; justify-content: flex-end; margin-bottom: 1rem; max-width: 800px; margin: 0 auto 1rem auto;}
        
        .grid-container { width: 100%; overflow-x: auto; display: flex; justify-content: center; }
        .life-grid { display: flex; flex-direction: column; gap: 2px; transition: filter 0.3s ease; }
        .life-grid.blurred { filter: blur(8px); opacity: 0.7; }
        .year-row { display: flex; gap: 2px; align-items: center; }
        .week-box { width: 10px; height: 10px; border: 1px solid var(--border-color); background-color: transparent; box-sizing: border-box; }
        .week-box.lived { background-color: var(--text-color); border-color: var(--text-color); }
        .week-box:nth-child(26) { margin-right: 12px; }
        .year-marker { width: 24px; font-family: var(--font-sans); font-size: 0.75rem; color: var(--text-color); margin-left: 8px; text-align: right; }

        .journal-actions { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 2rem auto; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
        .journal-empty { text-align: center; color: var(--text-light); font-style: italic; margin-top: 3rem; }
        .journal-list { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
        
        .journal-entry-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.8rem; }
        .journal-entry-date { font-family: var(--font-sans); color: var(--accent-color); font-size: 1.1rem; font-weight: bold; }
        .badge-today { background: var(--text-color); color: var(--bg-color); font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 12px; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 1px;}

        .hidden { display: none !important; }
        .error-msg { color: #b33939; font-size: 0.9rem; margin-top: 0.5rem; text-align: center; display: none; }

        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .grid-container { justify-content: center; }
            .year-row { gap: 1px; } 
            .life-grid { gap: 1px; } 
            .week-box { width: 4px; height: 4px; border-radius: 0; }
            .week-box:nth-child(26) { margin-right: 4px; }
            .year-marker { font-size: 0.65rem; margin-left: 4px; width: 15px; }
        }
    </style>
</head>
<body>

    <div id="app" class="container">
        
        <div id="setup-screen" class="setup-form">
            <h1>Memento Mori</h1>
            <label>Date de naissance (Obligatoire) :</label> 
            <input type="date" id="birthdate" required>
            <button class="btn-primary" onclick="startLocalMode()">Utiliser sans compte (Local)</button>
            
            <div class="github-section">
                <p style="font-size: 0.9rem; color: var(--text-light); margin:0;">🔒 Optionnel : Synchroniser avec GitHub Gist pour ne jamais perdre tes données.</p>
                <label>ID du Gist :</label> <input type="text" id="gist-id" placeholder="Ex: a1b2c3d4...">
                <label>Token GitHub :</label> <input type="password" id="github-token" placeholder="ghp_...">
                <button class="btn-secondary" id="btn-setup" onclick="startGithubMode()">Connecter GitHub</button>
                <div id="error-msg" class="error-msg"></div>
            </div>
        </div>

        <div id="main-screen" class="hidden">
            <nav>
                <div class="nav-item active" onclick="switchTab('question')" id="tab-question">La Question</div>
                <div class="nav-item" onclick="switchTab('memento')" id="tab-memento">Le Temps</div>
                <div class="nav-item" onclick="switchTab('journal')" id="tab-journal">Le Journal</div>
            </nav>

            <div id="view-question">
                <div class="nav-days">
                    <button class="nav-btn" onclick="changeDay(-1)">← Jour précédent</button>
                    <button class="nav-btn hidden" id="btn-next-day" onclick="changeDay(1)">Jour suivant →</button>
                </div>
                
                <div class="question-card">
                    <span class="current-date" id="display-date">JJ/MM/AAAA</span>
                    <h2 class="question-text" id="display-question">Chargement...</h2>
                    <textarea id="answer-input" placeholder="Écris ta réponse ici..." oninput="autoGrow(this)"></textarea>
                    <button class="btn-primary" id="btn-save" onclick="saveAnswer()">Sauvegarder dans mon journal</button>
                </div>
                <div id="history-container" class="history-container"></div>
            </div>

            <div id="view-memento" class="hidden">
                <div class="memento-header">
                    <div class="memento-stats" id="memento-stats">Tu as vécu X semaines pleines.</div>
                    <div class="memento-quote">« Ce n’est pas que nous avons peu de temps, c’est que nous en perdons beaucoup. » — Sénèque</div>
                </div>
                <div class="memento-actions">
                    <button class="nav-btn" onclick="togglePrivacy()">👁️ Masquer/Afficher la grille</button>
                </div>
                <div class="grid-container">
                    <div class="life-grid" id="life-grid"></div>
                </div>
            </div>

            <div id="view-journal" class="hidden">
                <div class="journal-actions">
                    <h2>Tes mémoires</h2>
                    <button class="btn-secondary" style="width:auto; margin:0;" onclick="exportData()">Exporter (JSON)</button>
                </div>
                <div id="journal-content" class="journal-list"></div>
            </div>
        </div>
    </div>

    <script>

        function init() {
            if (state.birthdate) {
                if (state.mode === 'github' && state.gistId && state.token) {
                    fetchGistData();
                } else if (state.mode === 'local') {
                    loadLocalData();
                    launchApp();
                }
            }

        function startLocalMode() {
            const bd = document.getElementById('birthdate').value;
            if (!bd) return alert("Il me faut au moins ta date de naissance !");
            localStorage.setItem('mm_birthdate', bd);
            localStorage.setItem('mm_mode', 'local');
            state.birthdate = bd; state.mode = 'local';
            loadLocalData(); launchApp();
        }

        function startGithubMode() {
            const bd = document.getElementById('birthdate').value;
            const gid = document.getElementById('gist-id').value;
            const tk = document.getElementById('github-token').value;
            if (!bd || !gid || !tk) return alert("Remplis la date de naissance, le Gist ID et le Token.");
            localStorage.setItem('mm_birthdate', bd);
            localStorage.setItem('mm_gistId', gid);
            localStorage.setItem('mm_token', tk);
            localStorage.setItem('mm_mode', 'github');
            state.birthdate = bd; state.gistId = gid; state.token = tk; state.mode = 'github';
            fetchGistData();
        }

        function loadLocalData() {
            const localData = localStorage.getItem('mm_journal_data');
            state.data = localData ? JSON.parse(localData) : {};
        }

        function saveLocalData() {
            localStorage.setItem('mm_journal_data', JSON.stringify(state.data));
            document.getElementById('btn-save').innerText = "✓ Sauvegardé en local !";
            setTimeout(() => { document.getElementById('btn-save').innerText = "Sauvegarder dans mon journal"; }, 2000);
            renderJournal();
        }

        async function fetchGistData() {
            const btn = document.getElementById('btn-setup');
            const errorDiv = document.getElementById('error-msg');
            btn.innerText = "Connexion en cours...";
            errorDiv.style.display = 'none';

            try {
                const response = await fetch(`https://api.github.com/gists/${state.gistId}`, {
                    headers: { 'Authorization': `token ${state.token}` }
                });
                
                if (!response.ok) throw new Error("Erreur Gist API");
                const gist = await response.json();
                
                if (gist.files[GIST_FILENAME] && gist.files[GIST_FILENAME].content) {
                    const content = gist.files[GIST_FILENAME].content;
                    state.data = content.trim() ? JSON.parse(content) : {};
                } else { state.data = {}; }
                launchApp();
            } catch (e) {
                console.error(e);
                errorDiv.innerText = "Erreur. Vérifie ton Token et que ton Gist contient bien un fichier nommé 'memento-mori.json'";
                errorDiv.style.display = 'block';
                btn.innerText = "Connecter GitHub";
                localStorage.removeItem('mm_mode'); state.mode = null;
            }
        }

        async function pushGistData() {
            const btn = document.getElementById('btn-save');
            btn.innerText = "Sauvegarde dans le Cloud...";
            btn.disabled = true;

            try {
                const response = await fetch(`https://api.github.com/gists/${state.gistId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `token ${state.token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(state.data, null, 2) } } })
                });
                if (!response.ok) throw new Error("Erreur");
                
                btn.innerText = "✓ Sauvegardé sur GitHub !";
                renderJournal();
                setTimeout(() => { btn.innerText = "Sauvegarder dans mon journal"; btn.disabled = false; }, 2000);
            } catch (e) {
                console.error(e);
                alert("Échec de la sauvegarde GitHub. On sauvegarde en local en attendant.");
                saveLocalData(); btn.disabled = false;
            }
        }

        function launchApp() {

        function autoGrow(element) { element.style.height = "5px"; element.style.height = (element.scrollHeight) + "px"; }

        function changeDay(offset) {

        }

        function updateDisplay() {
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + currentDateOffset);

            const day = String(targetDate.getDate()).padStart(2, '0');
            const month = String(targetDate.getMonth() + 1).padStart(2, '0');
            const yearStr = String(targetDate.getFullYear());
            
            document.getElementById('display-date').innerText = `${day}/${month}/${yearStr}`;
            
            let questionText = "";
            if (month === '02' && day === '29') {
                questionText = leapYearQuestion;
            } else {
                const start = new Date(targetDate.getFullYear(), 0, 0);
                const diff = (targetDate - start) + ((start.getTimezoneOffset() - targetDate.getTimezoneOffset()) * 60 * 1000);
                let dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
                if (isLeapYear(targetDate.getFullYear()) && targetDate > new Date(targetDate.getFullYear(), 1, 28)) dayOfYear -= 1;
                questionText = questions[dayOfYear - 1] || "Question introuvable.";
            }
            document.getElementById('display-question').innerText = questionText;
            
            const monthDayKey = `${month}-${day}`;
            const textArea = document.getElementById('answer-input');
            
            if (state.data[monthDayKey] && state.data[monthDayKey][yearStr]) {
                textArea.value = state.data[monthDayKey][yearStr];
            } else { textArea.value = ""; }
            autoGrow(textArea);

            const historyContainer = document.getElementById('history-container');
            historyContainer.innerHTML = ''; 

            if (state.data[monthDayKey]) {
                const pastYears = Object.keys(state.data[monthDayKey]).sort((a, b) => b - a);
                pastYears.forEach(y => {
                    if (y !== yearStr) { 
                        const card = document.createElement('div');
                        card.className = 'history-card';
                        card.innerHTML = `<span class="history-year">${y}</span><p class="history-text">${state.data[monthDayKey][y]}</p>`;
                        historyContainer.appendChild(card);
                    }
                });
            }
        }

        function isLeapYear(year) { return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0); }

        function saveAnswer() {
            const answer = document.getElementById('answer-input').value.trim();
            if (!answer) return;

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + currentDateOffset);
            
            const day = String(targetDate.getDate()).padStart(2, '0');
            const month = String(targetDate.getMonth() + 1).padStart(2, '0');
            const yearStr = String(targetDate.getFullYear());
            const monthDayKey = `${month}-${day}`;
            
            if (!state.data[monthDayKey]) state.data[monthDayKey] = {};
            state.data[monthDayKey][yearStr] = answer;
            
            if (state.mode === 'github') { pushGistData(); } else { saveLocalData(); }
        }

        function renderMementoMori() {
            const birthDate = new Date(state.birthdate);
            const today = new Date();
            const msPerWeek = 1000 * 60 * 60 * 24 * 7;
            const weeksLived = Math.floor((today - birthDate) / msPerWeek);
            
            document.getElementById('memento-stats').innerText = `Tu as vécu ${weeksLived.toLocaleString('fr-FR')} semaines pleines.`;

            const grid = document.getElementById('life-grid');
            grid.innerHTML = '';
            const fragment = document.createDocumentFragment();
            let currentWeekIndex = 0;

            for (let y = 0; y < 80; y++) {
                const row = document.createElement('div');
                row.className = 'year-row';
                if (y > 0 && y % 5 === 0) row.style.marginTop = '6px';

                for (let w = 0; w < 52; w++) {
                    const box = document.createElement('div');
                    box.className = 'week-box';
                    if (currentWeekIndex < weeksLived) box.classList.add('lived');
                    row.appendChild(box);
                    currentWeekIndex++;
                }

                const marker = document.createElement('div');
                marker.className = 'year-marker';
                if ((y + 1) % 5 === 0) marker.innerText = (y + 1);
                row.appendChild(marker);
                fragment.appendChild(row);
            }
            grid.appendChild(fragment);
        }

        function togglePrivacy() { document.getElementById('life-grid').classList.toggle('blurred'); }

        function renderJournal() {

            }

            // 🧮 Mathématiques pour le tri cyclique
            const today = new Date();
            const currentM = today.getMonth() + 1;
            const currentD = today.getDate();
            
            function getDayOfYear(m, d) {
                const date = new Date(2024, m - 1, d); // 2024 est bissextile, base de calcul parfaite
                const start = new Date(2024, 0, 0);
                return Math.floor((date - start) / 86400000);
            }
            
            const todayDayOfYear = getDayOfYear(currentM, currentD);

            const sortedDates = Object.keys(state.data).sort((a, b) => {
                const [mA, dA] = a.split('-').map(Number);
                const [mB, dB] = b.split('-').map(Number);
                
                // Calcul de la distance dans le temps passé
                let distA = (todayDayOfYear - getDayOfYear(mA, dA) + 366) % 366;
                let distB = (todayDayOfYear - getDayOfYear(mB, dB) + 366) % 366;
                
                return distA - distB; // Ordre croissant de distance (Aujourd'hui = 0, donc en premier)
            });

            // 🎨 UI - Affichage
            sortedDates.forEach(dateKey => {
                const yearsObj = state.data[dateKey];
                const sortedYears = Object.keys(yearsObj).sort((a, b) => b - a);
                
                const entryDiv = document.createElement('div');
                entryDiv.style.borderBottom = "1px dashed var(--border-color)";
                entryDiv.style.paddingBottom = "1rem";
                
                const [m, d] = dateKey.split('-');
                const displayDate = `${d}/${m}`;
                
                // Vérifie si l'entrée est celle d'Aujourd'hui
                const isToday = (parseInt(m) === currentM && parseInt(d) === currentD);
                const badgeHtml = isToday ? '<span class="badge-today">Aujourd\'hui</span>' : '';
                
                entryDiv.innerHTML = `
                    <div class="journal-entry-header">
                        <span class="journal-entry-date">${displayDate}</span>
                        ${badgeHtml}
                    </div>
                `;
                
                sortedYears.forEach(year => {
                    entryDiv.innerHTML += `
                        <div style="margin-bottom: 0.5rem; background: rgba(255,255,255,0.4); padding: 1rem; border-radius: 4px; border-left: 2px solid var(--border-color);">
                            <strong style="color: var(--text-light); font-size: 0.85rem; display:block; margin-bottom:0.3rem;">${year}</strong> 
                            <span style="font-family: var(--font-main); line-height:1.5;">${yearsObj[year]}</span>
                        </div>
                    `;
                });
                container.appendChild(entryDiv);
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.data, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "memento-mori-backup.json");
            dlAnchorElem.click();
        }

        // Enregistrement PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((e) => console.log('SW Error:', e));
            });
        }

        init();
    </script>
</body>
</html>
