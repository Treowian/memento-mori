<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memento Mori</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <meta name="theme-color" content="#f4f1ea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --bg-color: #f4f1ea; 
            --text-main: #2c2c2c; 
            --text-light: #8c8880;
            --accent-gold: #a68d6a; 
            --navy-lived: #1600B0; 
            --milestone-gold: #d4af37;
            --border-subtle: #e1ddd5;
            --font-serif: 'Lora', serif;
            --font-sans: 'Inter', sans-serif;
        }

        body { 
            background-color: var(--bg-color); color: var(--text-main); 
            font-family: var(--font-sans); margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
        }

        /* --- HEADER --- */
        header {
            width: 100%; max-width: 1000px; padding: 2rem;
            display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
        }
        .logo { font-family: var(--font-serif); font-style: italic; font-weight: 600; font-size: 1.4rem; }
        
        nav { display: flex; gap: 1.5rem; }
        .nav-item { 
            cursor: pointer; color: var(--text-light); text-decoration: none; 
            font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 0.8rem; border-radius: 6px; transition: all 0.2s;
        }
        .nav-item.active { color: var(--text-main); background: #e8e4db; }

        .container { width: 100%; max-width: 900px; padding: 1rem 2rem 4rem 2rem; box-sizing: border-box; }

        /* --- VUE QUESTION --- */
        .question-meta { 
            font-size: 0.75rem; font-weight: 600; color: var(--accent-gold); 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1.5rem; 
        }
        .question-text { 
            font-family: var(--font-serif); font-size: 2.2rem; line-height: 1.2; 
            margin: 0 0 2.5rem 0; font-weight: 400; 
        }

        .navigation-row {
            display: flex; align-items: center; justify-content: center; gap: 2rem; margin-bottom: 3rem;
        }
        .nav-circle {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-light);
            transition: all 0.2s; background: transparent;
        }
        .nav-circle:hover { border-color: var(--text-main); color: var(--text-main); }
        .nav-circle.invisible { visibility: hidden; }

        .date-display { font-family: var(--font-serif); font-style: italic; font-size: 1.1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer;}
        .pill-today { 
            background: #4a3f35; color: #fff; font-family: var(--font-sans); 
            font-size: 0.65rem; font-weight: 600; padding: 0.2rem 0.6rem; 
            border-radius: 50px; text-transform: uppercase; letter-spacing: 1px;
        }

        textarea {
            width: 100%; min-height: 250px; background: rgba(255,255,255,0.2); 
            border: 1px solid var(--border-subtle); border-radius: 12px;
            font-family: var(--font-serif); font-size: 1.25rem; padding: 2rem;
            box-sizing: border-box; outline: none; resize: none; color: var(--text-main);
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: var(--accent-gold); }
        textarea::placeholder { font-style: italic; color: #b0aca2; }

        .save-bar { display: flex; justify-content: flex-end; margin-top: 1.5rem; }
        .btn-save {
            background: #4a3f35; color: white; border: none; padding: 0.8rem 2rem;
            border-radius: 8px; font-family: var(--font-sans); font-weight: 600;
            cursor: pointer; transition: opacity 0.2s;
        }
        .btn-save:hover { opacity: 0.9; }

        /* --- VUE MEMENTO --- */
        .memento-title { font-family: var(--font-serif); font-size: 2.2rem; margin-bottom: 0.5rem; }
        .memento-stats { color: var(--text-light); font-size: 1rem; margin-bottom: 2rem; line-height: 1.6; }
        .memento-stats strong { color: var(--text-main); }

        .grid-layout { display: flex; gap: 1rem; }
        .grid-y-axis { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
        .y-label { 
            height: 10px; font-size: 0.65rem; color: var(--text-light); 
            display: flex; align-items: center; justify-content: flex-end; width: 20px;
            margin-bottom: 0; /* Aligné sur la première bulle de la ligne */
        }
        
        .life-grid { display: flex; flex-direction: column; gap: 2px; }
        .year-row { display: flex; gap: 2px; }
        .week-box { 
            width: 10px; height: 10px; border-radius: 2px; /* Carré arrondi léger */
            background-color: transparent; border: 1px solid var(--border-subtle);
            box-sizing: border-box; transition: transform 0.1s;
        }
        .week-box.lived { background-color: var(--navy-lived); border: none; }
        .week-box.milestone { background-color: var(--milestone-gold); border: none; }
        .week-box.past { cursor: pointer; }
        .week-box.past:hover { transform: scale(1.4); z-index: 5; }

        .radar-zone { margin-bottom: 1rem; min-height: 1.2rem; font-size: 0.85rem; color: var(--accent-gold); font-weight: 600; }

        /* --- SETUP / MODALS --- */
        .setup-screen { text-align: center; margin-top: 10vh; }
        .hidden { display: none !important; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .week-box { width: 6px; height: 6px; }
            .y-label { height: 6px; font-size: 0.5rem; width: 12px;}
            .question-text { font-size: 1.6rem; }
            header { padding: 1rem; }
            .logo { font-size: 1.1rem; }
            nav { gap: 0.5rem; }
        }
        
        /* Modals & Dropdowns (Simplified for brevity) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--bg-color); padding: 2rem; border-radius: 12px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div id="setup-view" class="setup-screen">
        <h1 class="logo" style="font-size: 3rem; margin-bottom: 2rem;">Memento Mori</h1>
        <div style="max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; background: #fff; padding: 2rem; border-radius: 12px; border: 1px solid var(--border-subtle);">
            <label style="font-size: 0.9rem; text-align: left;">Date de naissance</label>
            <input type="date" id="birthdate" style="padding: 0.8rem; border: 1px solid var(--border-subtle); border-radius: 6px;">
            <button class="btn-save" onclick="startLocalMode()">Démarrer</button>
            <hr style="width: 100%; border: none; border-top: 1px dashed var(--border-subtle);">
            <input type="text" id="gist-id" placeholder="Gist ID (Optionnel)" style="padding: 0.8rem; border: 1px solid var(--border-subtle); border-radius: 6px;">
            <input type="password" id="github-token" placeholder="GitHub Token (Optionnel)" style="padding: 0.8rem; border: 1px solid var(--border-subtle); border-radius: 6px;">
            <button class="btn-save" style="background: var(--accent-gold);" onclick="startGithubMode()">Synchroniser GitHub</button>
        </div>
    </div>

    <div id="app-view" class="hidden" style="width:100%; display: flex; flex-direction: column; align-items: center;">
        <header>
            <div class="logo">Memento Mori</div>
            <nav>
                <div class="nav-item active" id="tab-question" onclick="switchTab('question')">📖 Aujourd'hui</div>
                <div class="nav-item" id="tab-memento" onclick="switchTab('memento')">⌛ Le Temps</div>
                <div class="nav-item" id="tab-journal" onclick="switchTab('journal')">📜 Journal</div>
            </nav>
        </header>

        <main class="container">
            <div id="view-question">
                <div class="question-meta" id="display-q-number">Question 117 / 365</div>
                <h2 class="question-text" id="display-question">...</h2>
                
                <div class="navigation-row">
                    <button class="nav-circle" onclick="changeDay(-1)">←</button>
                    <div class="date-display" onclick="toggleCalendar()">
                        <span id="display-date">27 Avril 2026</span>
                        <span id="pill-today" class="pill-today hidden">Aujourd'hui</span>
                    </div>
                    <button class="nav-circle" id="btn-next-day" onclick="changeDay(1)">→</button>
                </div>

                <textarea id="answer-input" placeholder="Écris ta réponse..."></textarea>
                
                <div class="save-bar">
                    <button class="btn-save" id="btn-save" onclick="saveAnswer()">Enregistrer</button>
                </div>
            </div>

            <div id="view-memento" class="hidden">
                <h2 class="memento-title">Ta vie en semaines</h2>
                <div class="memento-stats" id="memento-stats">...</div>
                
                <div class="radar-zone" id="grid-hover-info">Explorer le temps...</div>
                
                <div class="grid-layout">
                    <div class="grid-y-axis" id="grid-y-axis"></div>
                    <div class="life-grid" id="life-grid"></div>
                </div>
                
                <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                    <button class="btn-save" style="background: var(--accent-gold); font-size: 0.8rem;" onclick="openMilestoneModalWithDate(new Date().toISOString().split('T')[0])">+ Ajouter un événement</button>
                </div>
            </div>

            <div id="view-journal" class="hidden">
                <h2 class="memento-title">Journal de bord</h2>
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                    <select id="filter-month" onchange="renderJournal()" style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-subtle); background: white;"></select>
                    <select id="filter-year" onchange="renderJournal()" style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border-subtle); background: white;"></select>
                </div>
                <div id="journal-content"></div>
            </div>
        </main>
    </div>

    <div id="milestone-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="font-family: var(--font-serif); margin-top:0;">Événement</h3>
            <input type="date" id="milestone-date" style="width:100%; padding:0.5rem; margin-bottom:1rem;">
            <input type="text" id="milestone-input" placeholder="Que s'est-il passé ?" style="width:100%; padding:0.5rem; margin-bottom:1rem; border: 1px solid var(--border-subtle);">
            <div id="milestone-list" style="margin-bottom:1.5rem; max-height: 100px; overflow-y: auto;"></div>
            <div style="display:flex; gap:1rem; justify-content: flex-end;">
                <button onclick="closeMilestoneModal()" style="background:none; border:none; cursor:pointer;">Annuler</button>
                <button class="btn-save" onclick="saveMilestone()">Ajouter</button>
            </div>
        </div>
    </div>

    <script>
        // --- DONNÉES & LOGIQUE ---
        // (On réutilise ici les fonctions de navigation, Gist et Journal déjà validées)
        
        const questions = [
            "Quelle petite chose du quotidien mérite qu'on s'y attarde davantage ?", "Si tu devais te décrire en trois mots aujourd'hui, lesquels choisirais-tu ?", "Quelle habitude aimerais-tu adopter cette année ?", "Quelle est la chose dont tu es le plus fier en ce moment ?", "Qu'est-ce qui te donne de l'énergie quand tout va mal ?", "Si tu pouvais changer une seule chose dans ta vie aujourd'hui, ce serait quoi ?", "Quel rêve as-tu mis de côté et pourquoi ?", "Qui es-tu quand personne ne te regarde ?", "Quelle peur t'a le plus freiné l'an dernier ?", "Qu'est-ce que tu t'es promis que tu n'as pas tenu ?", "Quelle valeur est au cœur de tes décisions ?", "De quoi as-tu besoin en ce moment, honnêtement ?", "Si ta vie était un livre, quel serait le titre de ce chapitre ?", "Quelle version de toi-même veux-tu devenir ?", "Qu'est-ce que tu faisais enfant qui te rendait vraiment heureux ?", "Quelle est la dernière fois que tu t'es senti pleinement toi-même ?", "Qu'est-ce qui te manque en ce moment ?", "Quel conseil donnerais-tu à ton moi d'il y a 10 ans ?", "Qu'est-ce que tu n'arrives pas à te pardonner ?", "Quelle est ta plus grande force, celle que tu sous-estimes ?", "Qu'est-ce qui te retient d'être plus heureux ?", "Si tu avais une journée entière pour toi, comment la passerais-tu ?", "Quelle émotion ressens-tu le plus souvent ces derniers temps ?", "Qu'est-ce que tu veux vraiment, au fond ?", "Quelle croyance sur toi-même aimerais-tu abandonner ?", "Qu'est-ce qui te rend unique selon toi ?", "Quel mot résume ton état d'esprit de cette semaine ?", "Qu'est-ce que tu fais par obligation et que tu pourrais peut-être lâcher ?", "Quelle est la dernière chose qui t'a rendu vraiment heureux ?", "Qu'est-ce que tu apprécies dans ta solitude ?", "Quel aspect de ta vie mérite plus d'attention ?", "Si tu pouvais recommencer ce mois-ci, que ferais-tu différemment ?",
            // ... (Ici on insère les 365 questions)
        ];

        let currentDateOffset = 0;
        const state = {
            mode: localStorage.getItem('mm_mode'),
            birthdate: localStorage.getItem('mm_birthdate'),
            gistId: localStorage.getItem('mm_gistId'),
            token: localStorage.getItem('mm_token'),
            data: { milestones: {} }
        };

        const moisNoms = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];

        function init() {
            if (state.birthdate) {
                if (state.mode === 'github' && state.gistId && state.token) fetchGistData();
                else if (state.mode === 'local') { loadLocalData(); launchApp(); }
            }
        }

        // --- NAVIGATION ---
        function changeDay(offset) {
            currentDateOffset += offset;
            if (currentDateOffset > 0) currentDateOffset = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + currentDateOffset);
            
            const d = targetDate.getDate();
            const m = targetDate.getMonth();
            const y = targetDate.getFullYear();
            
            document.getElementById('display-date').innerText = `${d} ${moisNoms[m]} ${y}`;
            document.getElementById('pill-today').classList.toggle('hidden', currentDateOffset !== 0);
            document.getElementById('btn-next-day').classList.toggle('invisible', currentDateOffset === 0);

            // Question Logic
            const dayOfYear = Math.floor((targetDate - new Date(y, 0, 0)) / 86400000);
            const qIndex = (dayOfYear - 1) % questions.length;
            document.getElementById('display-q-number').innerText = `Question ${dayOfYear} / 365`;
            document.getElementById('display-question').innerText = questions[qIndex] || "De quoi as-tu envie de te souvenir aujourd'hui ?";

            // Answer Logic
            const key = `${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            document.getElementById('answer-input').value = (state.data[key] && state.data[key][y]) ? state.data[key][y] : "";
        }

        // --- GRID RENDERING ---
        function renderMementoMori() {
            const birth = new Date(state.birthdate);
            const now = new Date();
            const msPerWeek = 604800000;
            const weeksLived = Math.floor((now - birth) / msPerWeek);
            const totalWeeks = 80 * 52;
            const remaining = totalWeeks - weeksLived;
            const percent = ((weeksLived / totalWeeks) * 100).toFixed(1);

            document.getElementById('memento-stats').innerHTML = `
                Tu as vécu <strong>${weeksLived.toLocaleString()} semaines</strong> — ${Math.floor(weeksLived/52)} ans.<br>
                Il t'en reste <strong>${remaining.toLocaleString()}</strong> selon une espérance de 80 ans. <strong>${percent}%</strong> du chemin parcouru.
            `;

            const grid = document.getElementById('life-grid');
            const axis = document.getElementById('grid-y-axis');
            grid.innerHTML = ''; axis.innerHTML = '';
            
            for (let y = 0; y < 80; y++) {
                const row = document.createElement('div');
                row.className = 'year-row';
                
                // Axis labels
                const label = document.createElement('div');
                label.className = 'y-label';
                if ((y + 1) % 5 === 0) label.innerText = y + 1;
                axis.appendChild(label);

                for (let w = 0; w < 52; w++) {
                    const idx = y * 52 + w;
                    const box = document.createElement('div');
                    box.className = 'week-box';
                    
                    if (idx <= weeksLived) {
                        box.classList.add('lived', 'past');
                        box.onclick = () => openMilestoneModalForWeek(idx);
                    }
                    
                    // Milestone highlight
                    const boxDate = new Date(birth.getTime() + (idx * msPerWeek));
                    const dateStr = boxDate.toISOString().split('T')[0];
                    if (state.data.milestones[dateStr]) box.classList.add('milestone');

                    // Radar
                    box.onmouseenter = () => {
                        const mStr = `${moisNoms[boxDate.getMonth()]} ${boxDate.getFullYear()}`;
                        const events = state.data.milestones[dateStr] ? ` — ${state.data.milestones[dateStr].join(' & ')}` : "";
                        document.getElementById('grid-hover-info').innerText = mStr + events;
                    };

                    row.appendChild(box);
                }
                grid.appendChild(row);
            }
        }

        // --- FONCTIONS DE LANCEMENT & SAVES (Inchangées mais nécessaires) ---
        function switchTab(name) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-'+name).classList.add('active');
            document.getElementById('view-question').classList.add('hidden');
            document.getElementById('view-memento').classList.add('hidden');
            document.getElementById('view-journal').classList.add('hidden');
            document.getElementById('view-'+name).classList.remove('hidden');
            if(name === 'memento') renderMementoMori();
            if(name === 'journal') renderJournal();
        }

        function saveAnswer() {
            const val = document.getElementById('answer-input').value.trim();
            if (!val) return;
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + currentDateOffset);
            const key = `${String(targetDate.getMonth()+1).padStart(2,'0')}-${String(targetDate.getDate()).padStart(2,'0')}`;
            const year = targetDate.getFullYear();
            if (!state.data[key]) state.data[key] = {};
            state.data[key][year] = val;
            
            document.getElementById('btn-save').innerText = "Sauvegardé...";
            if (state.mode === 'github') pushGistData(); else saveLocalData();
            setTimeout(() => document.getElementById('btn-save').innerText = "Enregistrer", 2000);
        }

        function startLocalMode() {
            state.birthdate = document.getElementById('birthdate').value;
            if(!state.birthdate) return alert("Date requise");
            state.mode = 'local';
            localStorage.setItem('mm_birthdate', state.birthdate);
            localStorage.setItem('mm_mode', 'local');
            launchApp();
        }

        function launchApp() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            updateDisplay();
        }

        // ... (Les autres fonctions techniques Milesones/Gist/Journal restent identiques au workflow précédent)
        function openMilestoneModalWithDate(d) { 
            document.getElementById('milestone-modal').classList.remove('hidden'); 
            document.getElementById('milestone-date').value = d;
            refreshMilestoneList();
        }
        function closeMilestoneModal() { document.getElementById('milestone-modal').classList.add('hidden'); }
        function openMilestoneModalForWeek(idx) {
            const birth = new Date(state.birthdate);
            const d = new Date(birth.getTime() + (idx * 604800000)).toISOString().split('T')[0];
            openMilestoneModalWithDate(d);
        }
        function saveMilestone() {
            const d = document.getElementById('milestone-date').value;
            const t = document.getElementById('milestone-input').value.trim();
            if(!d || !t) return;
            if(!state.data.milestones[d]) state.data.milestones[d] = [];
            state.data.milestones[d].push(t);
            document.getElementById('milestone-input').value = "";
            refreshMilestoneList();
            renderMementoMori();
            if (state.mode === 'github') pushGistData(); else saveLocalData();
        }
        function refreshMilestoneList() {
            const d = document.getElementById('milestone-date').value;
            const cont = document.getElementById('milestone-list');
            cont.innerHTML = '';
            if(state.data.milestones[d]) {
                state.data.milestones[d].forEach(m => {
                    const item = document.createElement('div');
                    item.innerText = "• " + m;
                    item.style.fontSize = "0.85rem"; item.style.marginBottom = "0.4rem";
                    cont.appendChild(item);
                });
            }
        }
        
        // Synchro Gist & Local (Simulées ici pour la structure)
        function loadLocalData() { 
            const d = localStorage.getItem('mm_journal_data'); 
            if(d) state.data = JSON.parse(d);
            if(!state.data.milestones) state.data.milestones = {};
        }
        function saveLocalData() { localStorage.setItem('mm_journal_data', JSON.stringify(state.data)); }
        async function fetchGistData() { launchApp(); /* API Logic here */ }

        init();
    </script>
</body>
</html>
